# ============================================================
# ci.yml — Integración Continua (CI) para SIRS-SGAU
# Se ejecuta automáticamente en cada push al repositorio.
# ============================================================

name: CI — Integración Continua

# Evento disparador: cualquier push a cualquier rama
on:
  push:
    branches:
      - main
      - develop
      - '**'          # cubre también ramas de feature

jobs:
  build-and-test:
    name: 🔨 Build, Lint & Test
    runs-on: ubuntu-latest   # máquina virtual Ubuntu en los servidores de GitHub

    steps:
      # ----------------------------------------------------------
      # 1. Descargar el código fuente del repositorio
      # ----------------------------------------------------------
      - name: 📥 Checkout del código fuente
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Instalar Node.js en la versión requerida por el proyecto
      # ----------------------------------------------------------
      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'        # cachea node_modules para ejecuciones posteriores

      # ----------------------------------------------------------
      # 3. Instalar dependencias con npm install
      # ----------------------------------------------------------
      - name: 📦 Instalar dependencias (npm install)
        run: npm install

      # ----------------------------------------------------------
      # 4. Verificar tipado TypeScript (tsc --noEmit)
      # ----------------------------------------------------------
      - name: 🔍 Verificar tipos TypeScript
        run: npx tsc --noEmit

      # ----------------------------------------------------------
      # 5. Ejecutar el linter
      # ----------------------------------------------------------
      - name: 🧹 Ejecutar ESLint
        run: npm run lint

      # ----------------------------------------------------------
      # 6. Ejecutar pruebas unitarias con Jest
      # ----------------------------------------------------------
      - name: 🧪 Ejecutar pruebas unitarias
        run: npm test -- --ci --coverage

      # ----------------------------------------------------------
      # 7. Mostrar resultado de la ejecución
      # ----------------------------------------------------------
      - name: ✅ Resultado de la ejecución
        if: always()         # se ejecuta incluso si pasos anteriores fallan
        run: |
          echo "============================================"
          echo "  Workflow completado"
          echo "  Commit : ${{ github.sha }}"
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Fecha  : $(date)"
          echo "============================================"
